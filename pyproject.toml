[project]
name = "sr-harness"
version = "0.1.0"
description = "Drive Solar Realms' BBS door games (BRE, Falcon's Eye) under dosemu2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyte>=0.8.2"]

[project.scripts]
sr-harness = "sr_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sr_harness"]
